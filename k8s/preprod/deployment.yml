# =============================================================================
# Workloads preprod - Neon Beat
#
# Images a adapter selon votre registry CI/CD:
#   ghcr.io/neon-beat/neon-beat-back:preprod
#   ghcr.io/neon-beat/neon-beat-game-front:preprod
#   ghcr.io/neon-beat/neon-beat-admin-front:preprod
#   ghcr.io/neon-beat/neon-beat-virtual-buzzer:preprod
# =============================================================================

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neon-beat-preprod-couchdb
  namespace: neon-beat-preprod
  labels:
    app.kubernetes.io/name: couchdb
    app.kubernetes.io/part-of: neon-beat
    app.kubernetes.io/instance: preprod
spec:
  serviceName: neon-beat-preprod-couchdb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: couchdb
      app.kubernetes.io/instance: preprod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: couchdb
        app.kubernetes.io/part-of: neon-beat
        app.kubernetes.io/instance: preprod
    spec:
      containers:
        - name: couchdb
          image: couchdb:3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5984
          env:
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: neon-beat-preprod-secrets
                  key: COUCH_USERNAME
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neon-beat-preprod-secrets
                  key: COUCH_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 5984
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 5984
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: couchdb-data
              mountPath: /opt/couchdb/data
  volumeClaimTemplates:
    - metadata:
        name: couchdb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: neon-beat-preprod-back
  namespace: neon-beat-preprod
  labels:
    app.kubernetes.io/name: neon-beat-back
    app.kubernetes.io/part-of: neon-beat
    app.kubernetes.io/instance: preprod
spec:
  # Keep one replica until backend realtime state is externalized through
  # Redis/NATS or another event bus.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neon-beat-back
      app.kubernetes.io/instance: preprod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neon-beat-back
        app.kubernetes.io/part-of: neon-beat
        app.kubernetes.io/instance: preprod
    spec:
      containers:
        - name: backend
          image: ghcr.io/neon-beat/neon-beat-back:preprod
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: neon-beat-preprod-config
          env:
            - name: COUCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: neon-beat-preprod-secrets
                  key: COUCH_USERNAME
            - name: COUCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neon-beat-preprod-secrets
                  key: COUCH_PASSWORD
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

---

