# =============================================================================
# NetworkPolicy prod - Neon Beat
#
# Stratégie : default-deny tout le namespace, puis autorisation explicite.
#
# Flux autorisés :
#   Ingress NGINX  → backend, game-front, admin-front, buzzer-front
#   Backend        → CouchDB (port 5984)
#   Tout pod       → kube-dns (UDP/TCP 53)
#
# Voir DECISIONS.md D007.
# =============================================================================

# ── Règle 1 : Bloquer tout le trafic entrant par défaut ──────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: neon-beat-prod-default-deny
  namespace: neon-beat
  labels:
    app.kubernetes.io/part-of: neon-beat
    app.kubernetes.io/instance: prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---

# ── Règle 2 : Autoriser Ingress NGINX → backend ──────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: neon-beat-prod-allow-ingress-to-back
  namespace: neon-beat
  labels:
    app.kubernetes.io/name: neon-beat-back
    app.kubernetes.io/part-of: neon-beat
    app.kubernetes.io/instance: prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: neon-beat-back
      app.kubernetes.io/instance: prod
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080

---

# ── Règle 3 : Autoriser Ingress NGINX → frontends ────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: neon-beat-prod-allow-ingress-to-fronts
  namespace: neon-beat
  labels:
    app.kubernetes.io/part-of: neon-beat
    app.kubernetes.io/instance: prod
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - neon-beat-game-front
          - neon-beat-admin-front
          - neon-beat-virtual-buzzer
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80

---

# ── Règle 4 : Autoriser backend → CouchDB ────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: neon-beat-prod-allow-back-to-couchdb
  namespace: neon-beat
  labels:
    app.kubernetes.io/name: couchdb
    app.kubernetes.io/part-of: neon-beat
    app.kubernetes.io/instance: prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: couchdb
      app.kubernetes.io/instance: prod
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: neon-beat-back
              app.kubernetes.io/instance: prod
      ports:
        - protocol: TCP
          port: 5984
